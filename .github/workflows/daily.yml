name: Daily edition

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore archive state
        run: bun run scripts/archive-restore.ts
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          AZURE_STORAGE_CONTAINER: ${{ secrets.AZURE_STORAGE_CONTAINER }}

      - name: Ingest today's news
        # Ingest is non-deterministic (live feeds + Gemini) and fails loudly when a
        # source yields too few usable articles. Re-running rebuilds the pool from
        # scratch and usually clears the shortfall, so retry a few times before giving up.
        run: |
          for attempt in 1 2 3; do
            echo "::group::Ingest attempt $attempt"
            if bun run ingest; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Ingest attempt $attempt failed."
            if [ "$attempt" -lt 3 ]; then
              echo "Retrying in 15s..."
              sleep 15
            fi
          done
          echo "Ingest failed after 3 attempts." >&2
          exit 1
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Author today's edition
        run: bun run author

      - name: Save archive state
        run: bun run scripts/archive-save.ts
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          AZURE_STORAGE_CONTAINER: ${{ secrets.AZURE_STORAGE_CONTAINER }}

      - name: Generate the full site
        run: bun run generate
        env:
          # Cookieless Cloudflare Web Analytics beacon; no-op until the secret is set.
          CF_BEACON_TOKEN: ${{ secrets.CF_BEACON_TOKEN }}

      - name: Deploy to Cloudflare Pages
        run: bunx wrangler@3 pages deploy dist --project-name "$CF_PAGES_PROJECT" --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}

      - name: Smoke-check the live site
        run: bun run scripts/smoke-check.ts
        env:
          SITE_URL: ${{ vars.SITE_URL }}

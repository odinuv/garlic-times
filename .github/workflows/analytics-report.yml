name: Weekly traffic report

# Pulls the last 7 days of Cloudflare zone analytics (cookieless, server-side)
# and records them as a traffic baseline. Runs every Monday and on demand.
# The rendered numbers appear in the run's job summary and are appended to
# docs/traffic-log.md so weekly numbers live in one repeatable place.

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:
    inputs:
      days:
        description: "Look-back window in days"
        required: false
        default: "7"

concurrency:
  group: analytics-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Generate traffic report
        run: bun run scripts/analytics-report.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DAYS: ${{ github.event.inputs.days || '7' }}
          REPORT_OUT: report.md

      - name: Append to traffic log
        run: |
          if [ ! -f report.md ]; then
            echo "No report.md produced; skipping log update."
            exit 0
          fi
          mkdir -p docs
          touch docs/traffic-log.md
          if [ ! -s docs/traffic-log.md ]; then
            printf '# Traffic log\n\nWeekly baselines, newest first. Generated by `.github/workflows/analytics-report.yml`.\n' > docs/traffic-log.md
          fi
          { echo ""; echo "---"; echo ""; cat report.md; echo ""; cat docs/traffic-log.md; } > docs/traffic-log.new
          mv docs/traffic-log.new docs/traffic-log.md
          rm -f report.md

      - name: Commit updated log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- docs/traffic-log.md; then
            git add docs/traffic-log.md
            git commit -m "chore(analytics): weekly traffic baseline"
            git push
          else
            echo "No change to traffic log."
          fi

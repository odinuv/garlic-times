name: Weekly traffic report

# Pulls the last 7 days of Cloudflare zone analytics (cookieless, server-side)
# and records them as a traffic baseline. Runs every Monday and on demand.
# The rendered numbers appear in the run's job summary and are persisted to the
# analytics Azure Blob container (raw JSON + markdown + a rolling traffic-log.md);
# nothing is committed back to the repo.

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:
    inputs:
      days:
        description: "Look-back window in days"
        required: false
        default: "7"

concurrency:
  group: analytics-report
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Generate traffic report
        run: bun run scripts/analytics-report.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DAYS: ${{ github.event.inputs.days || '7' }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          ANALYTICS_BLOB_CONTAINER: ${{ vars.ANALYTICS_BLOB_CONTAINER }}
          # GAR-9: owned-audience (email funnel) metrics, appended to the same report.
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
          MAILERLITE_GROUP_ID: ${{ vars.MAILERLITE_GROUP_ID }}
